services:
  - type: cron
    name: jerymotro-gee-fire-context
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "0 */6 * * *"
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEE_PROJECT
        sync: false
      - key: GEE_AUTH_MODE
        value: service_account
      - key: ENABLE_AUTO_LABELING
        value: "false"
      - key: DB_BATCH_SIZE
        value: "200"
      - key: GEE_BATCH_SIZE
        value: "200"
      - key: MAX_RECORDS_PER_RUN
        value: ""
      - key: REGION_FILTER
        value: ""
      - key: SYNC_LANDCOVER_COLUMN
        value: "false"
      - key: LOG_LEVEL
        value: INFO
