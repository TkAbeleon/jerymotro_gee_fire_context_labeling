services:
  - type: web
    name: jerymotro-gee-fire-context
    runtime: docker
    plan: 0.5c-512mb
    branch: main
    dockerfilePath: ./docker/render/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEE_PROJECT
        value: antigravitygcp-499308
      - key: GEE_AUTH_MODE
        value: service_account
      - key: GEE_SERVICE_ACCOUNT_JSON_PATH
        value: /etc/secrets/gee-service-account.json
      - key: ENABLE_AUTO_LABELING
        value: "true"
      - key: LABELING_START_DELAY_SECONDS
        value: "20"
      - key: INTERVAL_MINUTES
        value: "360"
      - key: DB_BATCH_SIZE
        value: "400"
      - key: GEE_BATCH_SIZE
        value: "400"
      - key: MAX_RECORDS_PER_RUN
        value: ""
      - key: REGION_FILTER
        value: ""
      - key: SYNC_LANDCOVER_COLUMN
        value: "false"
      - key: LOG_LEVEL
        value: INFO
